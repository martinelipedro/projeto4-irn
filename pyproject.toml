[project]
name = "projeto4-irn"
version = "1.0.0"
description = "Previsão temporal de traços com GRU e comparação com MLP DeepSets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "torch>=2.6", "matplotlib>=3.9", "scikit-learn>=1.7"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projeto4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
